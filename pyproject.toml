[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-encounter-intake-platform"
version = "1.0.0"
description = "A tenant-aware clinical encounter intake API and explainable note extraction prototype."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi[standard]>=0.110",
    "sqlmodel>=0.0.16",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "email-validator>=2.1",
    "PyJWT>=2.8",
    "passlib>=1.7.4",
    "itsdangerous>=2.1",
    "redis>=5.0",
    "spacy>=3.7,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
